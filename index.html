<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ascii-roid — ASCII Camera</title>
  <meta name="description" content="Kamera ASCII dari quotes kehidupan — Bahasa Indonesia & English." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=VT323&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=2" />
</head>

<body>

  <!-- ── HIDDEN CAMERA ELEMENTS ── -->
  <div style="display: none;">
    <video id="video" autoplay muted playsinline></video>
    <canvas id="captureCanvas"></canvas>
    <div id="cameraOff"></div>
    <div id="liveBadge"></div>
  </div>

  <!-- ── ASCII OUTPUT — PORTRAIT 4:3 ── -->
  <main class="ascii-stage">
    <div class="ascii-frame">
      <canvas id="bgVideoCanvas" class="bg-video"></canvas>
      <div id="asciiText" class="ascii-out"></div>
      <div id="overlayMsg" class="overlay">
        <div class="overlay-content">
          <p class="overlay-title">ASCII-ROID</p>
          <p class="overlay-hint">[ START ] kamera untuk memulai</p>
        </div>
      </div>
    </div>
  </main>

  <!-- ── BOTTOM BAR ── -->
  <footer class="bottombar">
    <div class="ctrl-pill">
      <div class="ctrl-row">
        <button id="btnCamera" class="btn-cam">[ START ]</button>
        <button id="btnFlip" class="btn-mono" title="Mirror">⇄</button>
        <button id="btnSwitchCam" class="btn-mono" title="Switch Camera" style="display: none;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 9V7a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v2"></path>
            <path d="M4 15v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"></path>
            <circle cx="12" cy="12" r="3"></circle>
            <path d="m16 5-4-4-4 4"></path>
            <path d="m8 19 4 4 4-4"></path>
          </svg>
        </button>
        <div class="ctrl-sep"></div>
        <label class="ctrl-label" for="selLang">LANG</label>
        <select id="selLang" class="ctrl-select">
          <option value="both">ID + EN</option>
          <option value="id">ID</option>
          <option value="en">EN</option>
        </select>
        <div class="ctrl-sep"></div>
        <button id="btnBgCam" class="btn-mono" title="Background Camera">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>
        <button id="btnToggleText" class="btn-mono" title="Toggle Text">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <polyline points="4 7 4 4 20 4 20 7"></polyline>
            <line x1="9" y1="20" x2="15" y2="20"></line>
            <line x1="12" y1="4" x2="12" y2="20"></line>
          </svg>
        </button>
        <button id="btnInvert" class="btn-mono" title="Invert ASCII">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M12 2a10 10 0 0 0 0 20z"></path>
          </svg>
        </button>
        <div class="ctrl-sep"></div>
        <button id="btnSnapshot" class="btn-mono" title="Snapshot">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"></path>
            <circle cx="12" cy="13" r="3"></circle>
          </svg>
        </button>

        <div class="ctrl-sep"></div>
        <button id="btnFullscreen" class="btn-mono" title="Fullscreen">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3">
            </path>
          </svg>
        </button>
        <button id="btnSettings" class="btn-mono" title="Settings">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </div>
  </footer>

  <!-- ── SNAPSHOT LIGHTBOX ── -->
  <div id="lightbox" class="lightbox" hidden>
    <div class="lb-backdrop" id="lightboxBg"></div>
    <div class="lb-box">
      <button class="lb-close" id="lightboxClose">✕ TUTUP</button>
      <div id="printContainer" class="print-container">
        <canvas id="lightboxCanvas"></canvas>
      </div>
      <p class="lb-hint">Double-click gambar untuk unduh</p>
      <div style="display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; justify-content: center;">
        <button id="btnDownload" class="btn-mono" style="background: #E9EBE2; color: #1A1A1A; border-radius: 99px; width: auto; padding: 8px 16px; font-family: 'Space Grotesk', sans-serif; font-size: 11px; font-weight: 500; letter-spacing: 0.1em;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 6px;">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          UNDUH
        </button>
        <button id="btnShare" class="btn-mono" style="background: #E9EBE2; color: #1A1A1A; border-radius: 99px; width: auto; padding: 8px 16px; font-family: 'Space Grotesk', sans-serif; font-size: 11px; font-weight: 500; letter-spacing: 0.1em;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 6px;">
            <circle cx="18" cy="5" r="3"></circle>
            <circle cx="6" cy="12" r="3"></circle>
            <circle cx="18" cy="19" r="3"></circle>
            <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
            <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
          </svg>
          BAGIKAN
        </button>
        <button id="btnPrint" class="btn-mono" style="background: #E9EBE2; color: #1A1A1A; border-radius: 99px; width: auto; padding: 8px 16px; font-family: 'Space Grotesk', sans-serif; font-size: 11px; font-weight: 500; letter-spacing: 0.1em;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 6px;">
            <polyline points="6 9 6 2 18 2 18 9"></polyline>
            <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
            <rect x="6" y="14" width="12" height="8"></rect>
          </svg>
          CETAK
        </button>
      </div>
    </div>
  </div>

  <!-- ── SETTINGS MODAL ── -->
  <div id="settingsModal" class="lightbox" hidden>
    <div class="lb-backdrop" id="settingsBg"></div>
    <div class="lb-box settings-box">
      <h2 class="settings-title">PENGATURAN TEKS</h2>
      <div class="settings-form">
        <div class="settings-group">
          <label>AUTHOR</label>
          <input type="text" id="inpAuthor" placeholder="by @djoardi" />
        </div>
        <div class="settings-group">
          <label>CONTACT LABEL</label>
          <input type="text" id="inpContactLabel" placeholder="IG/WA" />
        </div>
        <div class="settings-group">
          <label>CONTACT VALUE</label>
          <input type="text" id="inpContactValue" placeholder="+62 812 4678 2525" />
        </div>
        <div class="settings-group">
          <label>DESKRIPSI</label>
          <input type="text" id="inpDescription" placeholder="Tambahan info..." />
        </div>
        <button id="btnSaveSettings" class="btn-cam" style="width: 100%; margin-top: 12px; background: #1A1A1A; color: #E9EBE2;">SIMPAN</button>
      </div>
      <button class="lb-close" id="settingsClose" style="color: #1A1A1A; border-color: #1A1A1A; margin-top: 8px;">✕ TUTUP</button>
    </div>
  </div>

  <!-- ── TOAST ── -->
  <div id="toast" class="toast"></div>

  <script src="app.js"></script>
</body>

</html>
